[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ws_syntax = { path = "crates/ws_syntax" }
ws_resolve = { path = "crates/ws_resolve" }
ws_check = { path = "crates/ws_check" }
ws_ir = { path = "crates/ws_ir" }
ws_codegen_py = { path = "crates/ws_codegen_py" }
ws_runtime = { path = "crates/ws_runtime" }

clap = { version = "4.5", features = ["derive"] }
insta = "1.40"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
