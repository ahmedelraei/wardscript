[workspace]
resolver = "3"
members = ["crates/*"]
# The Python binding links against Python; maturin builds it (see crates/ward_runtime/py).
default-members = [
    "crates/ward_syntax",
    "crates/ward_resolve",
    "crates/ward_check",
    "crates/ward_ir",
    "crates/ward_codegen_py",
    "crates/ward_codegen_ts",
    "crates/ward_runtime",
    "crates/ward_lsp",
    "crates/ward_cli",
    "crates/ward_wasm",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ward_syntax = { path = "crates/ward_syntax" }
ward_resolve = { path = "crates/ward_resolve" }
ward_check = { path = "crates/ward_check" }
ward_ir = { path = "crates/ward_ir" }
ward_codegen_py = { path = "crates/ward_codegen_py" }
ward_codegen_ts = { path = "crates/ward_codegen_ts" }
ward_runtime = { path = "crates/ward_runtime" }
ward_lsp = { path = "crates/ward_lsp" }

clap = { version = "4.5", features = ["derive", "env"] }
insta = "1.40"
ariadne = "0.6"
la-arena = "0.3.1"
logos = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
