[package]
name = "ward_runtime_py"
description = "Python binding of the Wardscript runtime core: the `wardscript._core` module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310"] }
serde_json.workspace = true
ward_runtime.workspace = true

[features]
# Enabled by maturin (see crates/ward_runtime/py/pyproject.toml): don't link libpython.
extension-module = ["pyo3/extension-module"]

# Not the workspace lints: PyO3's macros expand to `unsafe` code, which the workspace forbids.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
