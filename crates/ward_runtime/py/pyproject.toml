[project]
name = "wardscript"
version = "0.0.1"
description = "Runtime for Python modules compiled from Wardscript"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wardscript"]
