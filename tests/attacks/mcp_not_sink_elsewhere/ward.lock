{
  "version": 1,
  "servers": {
    "gmail": {
      "tools": [
        {
          "name": "label_message",
          "description": "Adds a label to a message.",
          "inputSchema": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "label": {
                "type": "string"
              }
            },
            "required": [
              "id",
              "label"
            ]
          },
          "annotations": {
            "readOnlyHint": false,
            "openWorldHint": false
          }
        },
        {
          "name": "list_messages",
          "description": "Ids of messages matching a Gmail search query, one per line.",
          "inputSchema": {
            "type": "object",
            "properties": {
              "query": {
                "type": "string"
              },
              "limit": {
                "type": "integer",
                "description": "At most this many."
              }
            },
            "required": [
              "query"
            ]
          },
          "annotations": {
            "readOnlyHint": true,
            "openWorldHint": false
          }
        },
        {
          "name": "read_message",
          "description": "A message's sender, subject and body, as text.",
          "inputSchema": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": [
              "id"
            ]
          },
          "annotations": {
            "readOnlyHint": true,
            "openWorldHint": false
          }
        },
        {
          "name": "send_email",
          "description": "Sends an email.",
          "inputSchema": {
            "type": "object",
            "properties": {
              "to": {
                "type": "string"
              },
              "subject": {
                "type": "string"
              },
              "body": {
                "type": "string"
              },
              "cc": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              }
            },
            "required": [
              "to",
              "subject",
              "body"
            ]
          },
          "annotations": {
            "readOnlyHint": false,
            "destructiveHint": false,
            "openWorldHint": true
          }
        }
      ]
    }
  }
}
