name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Fail instead of writing .snap.new files when a snapshot doesn't match.
      INSTA_UPDATE: no
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The oldest Python that generated code supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      # The default members: everything but the Python binding, which maturin builds below.
      - run: cargo test

  wheel:
    runs-on: ubuntu-latest
    env:
      INSTA_UPDATE: no
      CI: true
      # Test against the installed wheel, with the Rust core, not the source tree.
      WARD_RUNTIME_INSTALLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - run: pip install "maturin>=1.7,<2"
      - run: maturin build --release -o dist
        working-directory: crates/ward_runtime/py
      - run: pip install crates/ward_runtime/py/dist/*.whl
      - run: cargo test -p ward_runtime --test python -p ward_cli --test e2e --test trace
